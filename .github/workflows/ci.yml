name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Action majors are the newest available, not the oldest that clears the
      # "Node.js 20 is deprecated … forced to run on Node.js 24" annotation.
      # Verified against each action.yml: checkout, setup-node and cache all
      # move to node24 at v5, so v5 would have been enough; the newest majors
      # cost nothing more and mean this is not revisited.
      #
      # cache and setup-clojure are bumped too. The deprecation annotation
      # named only checkout / setup-node / setup-java, but cache@v4 and
      # setup-clojure@13.4 both declare node20 as well and would have been
      # left behind by a bump that trusted the annotation's list.
      - uses: actions/checkout@v7

      - name: Install Clojure + Java
        # 13.6.1 is the first setup-clojure release on node24.
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          # A Clojure CLI version, NOT the language version. These are four
          # parts (1.12.5.1664); deps.edn pins the LANGUAGE at 1.11.3, and
          # that is what was written here. download.clojure.org answers 403
          # for linux-install-1.11.3.sh because no such CLI release exists,
          # which the action surfaces as a bare "Unexpected HTTP response:
          # 403" — indistinguishable from a rate limit, and it is not one.
          cli: 1.12.5.1664
          # Harmless and worth keeping: the action queries GitHub for tools
          # like bb and clj-kondo, and is rate limited unauthenticated.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # bun runs the CLJS suite. setup-bun v2 is on node24, so this does not
      # walk back the deprecation fix above.
      - name: Install bun (runs the .cljc suite on a JS runtime)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node stays, and not as a leftover. Two things here genuinely want it:
      #
      #   - real_external_test spawns `npx -y @modelcontextprotocol/*`. That is
      #     the pattern defport DOCUMENTS for consumers in
      #     mcp/client/transports/subprocess.cljc, so the test should keep
      #     exercising npx rather than being rewritten to bunx to suit our
      #     toolchain. It skips cleanly when npx is absent, and a skipped
      #     integration test is the thing this repo was just criticised for.
      #   - shadow-cljs's :autorun spawns node itself.
      #
      # No `cache:` — the ~/.npm cache is hand-rolled below. setup-node v5+ can
      # enable npm caching on its own, but only when package.json declares
      # packageManager or devEngines.packageManager; this repo ships a
      # package-lock.json and no package.json, so the bump cannot switch caching
      # on behind our back.
      - name: Install Node (for the npx-based MCP fixtures)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache Clojure deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-${{ hashFiles('**/deps.edn') }}

      - name: Cache npm cache (for npx -y @modelcontextprotocol/*)
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-mcp

      # ------------------------------------------------------------------
      # Optional integration peers
      # ------------------------------------------------------------------
      # The integration tests skip if their external tool is unavailable.
      # CI installs them in setup so the full suite runs unconditionally.

      - name: Install rust-analyzer (for LSP integration test)
        run: |
          rustup component add rust-analyzer
          rust-analyzer --version

      - name: Install debugpy (for DAP integration test)
        run: |
          python3 -m pip install --user debugpy
          python3 -c "import debugpy; print(debugpy.__version__)"

      # ------------------------------------------------------------------
      # Tests
      # ------------------------------------------------------------------

      - name: Kaocha (JVM tests + real-external integration)
        run: clojure -M:kaocha

      # Proves the README's cross-platform claim from THIS repo. It used to
      # `cd ..` into a defnet checkout, which only exists on a machine where
      # defport is a subdirectory of one.
      - name: Compile the .cljc surface for Node
        run: clojure -M:cljs compile test

      # Separate step, and load-bearing: `shadow-cljs compile` exits 0 even
      # when :autorun has just run the suite and reported failures. Measured —
      # a deliberately broken assertion gave "1 failures" and exit 0. So
      # turning :autorun on makes the suite RUN but does not make CI fail;
      # only running the built bundle does, which exits 1 on any failure.
      #
      # Run under bun, and again under node. The point of this suite is the
      # README's cross-platform claim, and "works on a JS runtime" is a weaker
      # statement than "works on the two JS runtimes anyone here uses" — both
      # were measured at 13 tests / 118 assertions green.
      - name: Run the .cljc suite on bun
        run: bun out/node-test.js

      - name: Run the .cljc suite on node
        run: node out/node-test.js

