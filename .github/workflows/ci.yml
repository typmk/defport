name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Clojure + Java
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          # A Clojure CLI version, NOT the language version. These are four
          # parts (1.12.5.1664); deps.edn pins the LANGUAGE at 1.11.3, and
          # that is what was written here. download.clojure.org answers 403
          # for linux-install-1.11.3.sh because no such CLI release exists,
          # which the action surfaces as a bare "Unexpected HTTP response:
          # 403" — indistinguishable from a rate limit, and it is not one.
          cli: 1.12.5.1664
          # Harmless and worth keeping: the action queries GitHub for tools
          # like bb and clj-kondo, and is rate limited unauthenticated.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node (for shadow-cljs + MCP server fixtures)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-clj-${{ hashFiles('**/deps.edn') }}

      - name: Cache npm cache (for npx -y @modelcontextprotocol/*)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-mcp

      # ------------------------------------------------------------------
      # Optional integration peers
      # ------------------------------------------------------------------
      # The integration tests skip if their external tool is unavailable.
      # CI installs them in setup so the full suite runs unconditionally.

      - name: Install rust-analyzer (for LSP integration test)
        run: |
          rustup component add rust-analyzer
          rust-analyzer --version

      - name: Install debugpy (for DAP integration test)
        run: |
          python3 -m pip install --user debugpy
          python3 -c "import debugpy; print(debugpy.__version__)"

      # ------------------------------------------------------------------
      # Tests
      # ------------------------------------------------------------------

      - name: Kaocha (JVM tests + real-external integration)
        run: clojure -M:kaocha

      # Proves the README's cross-platform claim from THIS repo. It used to
      # `cd ..` into a defnet checkout, which only exists on a machine where
      # defport is a subdirectory of one.
      - name: Compile the .cljc surface for Node
        run: clojure -M:cljs compile test

